<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theater</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(135deg, #050505, #111, #000);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .page {
      width: 90%;
      max-width: 900px;
      text-align: center;
      padding: 48px 32px;
      border-radius: 32px;
      background: rgba(20, 20, 20, 0.82);
      box-shadow:
        0 0 60px rgba(255, 255, 255, 0.08),
        inset 0 0 40px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    p {
      color: rgba(255, 255, 255, 0.68);
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 28px;
      justify-items: center;
      align-items: start;
    }

    .app-button {
      width: 130px;
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 35px rgba(255, 255, 255, 0.18);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .app-button:hover .app-icon {
      transform: translateY(-3px) scale(1.06);
      box-shadow: 0 18px 45px rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.18);
    }

    .app-button:active .app-icon {
      transform: scale(0.96);
    }

    .app-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(90px);
      z-index: -1;
    }

    .glow.one {
      top: -120px;
      left: -120px;
    }

    .glow.two {
      bottom: -140px;
      right: -120px;
    }
  </style>
</head>

<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="page">
    <h1>Theater Mode</h1>
    <p>Scegli un’app da aprire.</p>

    <section class="app-grid">

      <a
        class="app-button"
        href="https://www.youtube.com/redirect?q=http://mlb.tv"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Apri MLB.TV"
      >
        <img
          class="app-icon"
          src="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/8f/d2/1b/8fd21bf2-27a6-87eb-86bb-70e233a541c7/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg"
          alt="MLB"
        />
        <span class="app-label">MLB.TV</span>
      </a>

    </section>
  </main>
</body>
</html>
