<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theater</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(135deg, #050505, #111, #000);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .theater {
      width: 90%;
      max-width: 900px;
      text-align: center;
      padding: 48px 32px;
      border-radius: 32px;
      background: rgba(20, 20, 20, 0.82);
      box-shadow:
        0 0 60px rgba(255, 255, 255, 0.08),
        inset 0 0 40px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
        #090909;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .play-icon {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .play-icon::before {
      content: "";
      margin-left: 8px;
      border-left: 30px solid white;
      border-top: 20px solid transparent;
      border-bottom: 20px solid transparent;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 12px;
    }

    p {
      color: rgba(255, 255, 255, 0.68);
      font-size: 1.1rem;
      margin-bottom: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 34px;
      border-radius: 999px;
      background: white;
      color: black;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
      box-shadow: 0 12px 35px rgba(255, 255, 255, 0.18);
    }

    .button:hover {
      transform: translateY(-3px) scale(1.03);
      background: #f2f2f2;
      box-shadow: 0 18px 45px rgba(255, 255, 255, 0.28);
    }

    .button:active {
      transform: scale(0.98);
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(90px);
      z-index: -1;
    }

    .glow.one {
      top: -120px;
      left: -120px;
    }

    .glow.two {
      bottom: -140px;
      right: -120px;
    }
  </style>
</head>

<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="theater">
    <section class="screen">
      <div class="play-icon"></div>
    </section>

    <h1>Theater Mode</h1>
    <p>Apri l’esperienza in modalità cinema.</p>

    <a
      class="button"
      href="https://www.youtube.com/redirect?q=http://mlb.tv"
      target="_blank"
      rel="noopener noreferrer"
    >
      Apri MLB.TV
    </a>
  </main>
</body>
</html>
